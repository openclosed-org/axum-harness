- name: cache
  type: cache
  description: |
    In-memory cache layer for frequently accessed data. Supports multiple backends (Moka for in-process, Valkey/Dragonfly for distributed). Used for session data and hot paths.
  technology: moka/valkey
  required_by:
  - web-bff
- name: nats
  type: message_broker
  description: |
    NATS JetStream message broker. Provides event streaming, pub/sub messaging, and durable event sourcing for production deployments. Local development may use in-memory event bus.
  technology: nats
  required_by:
  - event-bus
  - outbox-relay-worker
  - indexer-worker
- name: observability
  type: observability
  description: |
    Telemetry stack for logging, metrics, tracing, and distributed tracing. Uses OpenTelemetry SDK with vector for log aggregation and OpenObserve for storage and visualization.
  technology: otel/vector/openobserve
  required_by:
  - web-bff
  - edge-gateway
- name: surrealdb
  type: database
  description: |
    External SurrealDB database server used as the preferred optional document/ graph operational datastore for this template. It is managed as an independent process/container when enabled by a resource preset, configured through platform profiles and SOPS secrets, and accessed through repository ports. PostgreSQL is not the reference backend for this repository.
  technology: surrealdb
  required_by:
  - tenant-service
  - counter-service
  - user-service
- name: turso
  type: database
  description: |
    SQLite-compatible distributed database (libSQL). Primary low-resource path is embedded libSQL/SQLite file storage; Turso Cloud is an optional managed backend when teams want to externalize the database without operating a local database container. PostgreSQL is not the reference backend for this repository.
  technology: turso/libsql
  required_by:
  - counter-service
  - user-service
  - tenant-service
  - auth-service
