# Gate Matrix
# Select gates from changed paths, risk category, and evidence level.
# Subagent identity routes work; it does not make a gate required.

version: 2
updated: "2026-05-09"

strengths:
  advisory:
    blocking: false
    purpose: Early signal, optional lanes, non-default shells, or exploratory checks.
  guardrail:
    blocking: true
    purpose: Normal PR protection for boundaries, drift, default backend-core, contracts, and path-scoped validation.
  invariant:
    blocking: true
    purpose: P0 correctness and release readiness only; requires executable evidence.

evidence_levels:
  declared:
    source: Metadata or prose only.
    can_be_claimed_from_yaml_only: true
  checked:
    source: Schema validation, static validation, typecheck, drift check, or boundary check.
    can_be_claimed_from_yaml_only: false
  tested:
    source: Unit, integration, contract, replay, resilience, or end-to-end tests.
    can_be_claimed_from_yaml_only: false
  proven:
    source: Executed gate or test evidence appropriate for the claimed invariant.
    can_be_claimed_from_yaml_only: false

gates:
  verify_backend_primary:
    command: ["just", "check-backend-primary"]
    label: Default backend-core static guardrail
    strength: guardrail
    scope: backend-core

  test_backend_primary:
    command: ["just", "test-backend-primary"]
    label: Default backend-core tests
    strength: guardrail
    scope: backend-core

  verify_repo:
    command: ["just", "verify"]
    label: Repo-wide backend-core verify
    strength: guardrail
    scope: repo
    note: Use when broader confidence is needed; not a default requirement for every change.

  gate_ci_single_node:
    command: ["just", "gate-ci-single-node"]
    label: GitHub/local single-node backend profile
    strength: guardrail
    scope: repo
    note: Runs backend primary and alternative provider lanes plus SOPS, platform, topology, observability, boundary, and generated artifact checks.

  smoke_local_k3d:
    command: ["just", "smoke-local-k3d"]
    label: Local Colima + K3d infrastructure smoke
    strength: guardrail
    scope: infra
    note: Tests local K3d nodes, SOPS reconcile, addon apply, SurrealDB Service DNS/HTTP, and SurrealDB PVC pod-restart persistence. Does not prove production K3s or Flux reconciliation.

  gate_local_k3d:
    command: ["just", "gate-local-k3d"]
    label: Full local K3d profile gate
    strength: guardrail
    scope: infra
    note: Runs gate-ci-single-node, smoke-local-k3d, secret checks, worker source/config smoke, and observability config smoke.

  verify_surrealdb_compose_persistence:
    command: ["just", "verify-surrealdb-compose-persistence"]
    label: Local compose SurrealDB persistence smoke
    strength: guardrail
    scope: infra
    note: Tests local compose SurrealDB named-volume persistence across container restart; does not prove K3d/K3s PVC behavior.

  boundary_check:
    command: ["just", "boundary-check"]
    label: Boundary check
    strength: guardrail
    scope: repo

  typecheck:
    command: ["just", "typecheck"]
    label: Type check
    strength: guardrail
    scope: repo

  contracts_check:
    command: ["just", "verify-contracts", "strict"]
    label: Contract validation
    strength: guardrail
    scope: contract

  typegen:
    command: ["just", "typegen"]
    label: Contract type generation
    strength: guardrail
    scope: contract

  drift_check:
    command: ["just", "drift-check"]
    label: Contract generated drift check
    strength: guardrail
    scope: contract

  sdk_drift_check:
    command: ["just", "sdk-drift-check"]
    label: SDK drift check
    strength: guardrail
    scope: contract

  validate_platform:
    command: ["just", "validate-platform"]
    label: Platform model validation
    strength: guardrail
    scope: platform

  validate_state:
    command: ["just", "validate-state", "strict"]
    label: State metadata validation
    strength: guardrail
    scope: platform
    note: Checks declarations; does not prove runtime state correctness by itself.

  validate_workflows:
    command: ["just", "validate-workflows", "strict"]
    label: Workflow metadata validation
    strength: guardrail
    scope: platform
    note: Checks declarations; does not prove workflow runtime correctness by itself.

  validate_topology:
    command: ["just", "validate-topology"]
    label: Topology validation
    strength: guardrail
    scope: platform

  verify_generated:
    command: ["just", "verify-generated-artifacts"]
    label: Generated artifact drift check
    strength: guardrail
    scope: platform

  verify_replay:
    command: ["just", "verify-replay", "strict"]
    label: Replay verification
    strength: invariant
    scope: worker

  verify_counter_delivery:
    command: ["just", "verify-counter-delivery", "strict"]
    label: Counter delivery admission verification
    strength: invariant
    scope: delivery

  validate_resilience:
    command: ["cargo", "run", "-p", "repo-tools", "--", "validate-resilience", "--mode", "warn"]
    label: Resilience checks
    strength: advisory
    scope: worker

  gate_release:
    command: ["just", "gate-release"]
    label: Release gate
    strength: invariant
    scope: release
    note: Includes SemVer compatibility when a baseline tag exists, contract drift, backend-only audit, CI gate, and release build. Defaults to RELEASE_TYPE=minor; set RELEASE_TYPE=major for intentional breaking releases.

path_rules:
  - match:
      - AGENTS.md
      - agent/**
      - .agents/**
      - docs/architecture/**
      - docs/adr/**
      - docs/governance/**
      - docs/archive/**
    recommended:
      - boundary_check
    required: []
    note: Coordination-only changes should not trigger heavy platform or release gates by default.

  - match:
      - Justfile
      - justfiles/**
      - moon.yml
    recommended:
      - boundary_check
      - typecheck
    required:
      - verify_backend_primary
    note: Shared tooling can affect the backend-core lane; prefer scoped checks before repo-wide verify.

  - match:
      - justfiles/quality/gates.just
      - justfiles/ops/k3d.just
      - justfiles/ops/multipass.just
      - docs/operations/gate-profiles.md
      - docs/operations/advanced-topology/k3d-local.md
      - docs/operations/advanced-topology/k3s-local-multipass.md
    recommended:
      - gate_ci_single_node
      - smoke_local_k3d
      - boundary_check
    required: []
    note: Local profile changes need executable profile evidence when tools are available; keep Multipass protected/manual unless explicitly requested.

  - match:
      - packages/contracts/**
      - docs/contracts/**
    recommended:
      - typegen
      - drift_check
      - sdk_drift_check
      - typecheck
      - boundary_check
    required:
      - contracts_check

  - match:
      - services/**
    recommended:
      - verify_backend_primary
      - test_backend_primary
      - boundary_check
    required: []
    note: Add contract, replay, or invariant gates only when the actual service change affects those risks.

  - match:
      - servers/**
    recommended:
      - verify_backend_primary
      - boundary_check
    required: []
    note: Add contracts_check when request/response/error shapes change.

  - match:
      - packages/authn/**
      - packages/authz/**
      - packages/security/**
    recommended:
      - verify_backend_primary
      - boundary_check
    required: []
    note: Run path-scoped cargo fmt/test/clippy for touched security crates; keep contracts framework-neutral.

  - match:
      - workers/**
    recommended:
      - verify_backend_primary
      - boundary_check
      - validate_resilience
    required: []
    note: Escalate to verify_replay when checkpoint, replay, projection rebuild, outbox, or idempotency behavior changes.

  - match:
      - platform/schema/**
      - platform/model/**
      - platform/validators/**
      - platform/generators/**
    recommended:
      - validate_platform
      - validate_state
      - validate_workflows
      - boundary_check
    required: []
    note: These gates validate declarations and generators; invariant claims need tests or stricter delivery evidence.

  - match:
      - platform/model/resources/surrealdb.yaml
      - docs/operations/surrealdb-lane.md
    recommended:
      - gate_ci_single_node
      - verify_surrealdb_compose_persistence
      - smoke_local_k3d
    required: []
    note: SurrealDB provider/resource changes are optional-lane changes; do not treat them as default backend-core prerequisites, but do test the explicit provider/runtime lanes when feasible.

  - match:
      - infra/**
      - ops/**
    recommended:
      - validate_platform
      - validate_topology
      - boundary_check
    required: []
    note: Escalate for secrets, topology, GitOps, or production delivery changes.

  - match:
      - infra/kubernetes/addons/**
      - infra/docker/compose/core.yaml
      - infra/security/sops/**
    recommended:
      - validate_platform
      - validate_topology
      - sops_validate
      - smoke_local_k3d
    required: []
    note: Runtime addon, compose, and secret-consumption changes need SOPS validation and local runtime smoke when the local toolchain is available; use compose persistence for SurrealDB compose-only changes.

  - match:
      - verification/**
      - fixtures/**
    recommended:
      - verify_backend_primary
      - boundary_check
    required: []
    note: Run the specific verification lane being changed.

risk_rules:
  contract_compatibility:
    when: External DTO, event, RPC, OpenAPI, SDK, or error-code shape changes.
    add_recommended:
      - contracts_check
      - typegen
      - drift_check
      - sdk_drift_check
    minimum_evidence: checked

  backend_core_behavior:
    when: Default counter/tenant/web-bff backend behavior changes without distributed semantics risk.
    add_recommended:
      - verify_backend_primary
      - test_backend_primary
      - boundary_check
    minimum_evidence: tested

  distributed_semantics:
    when: Idempotency, retry, checkpoint, replay, ordering, projection rebuild, outbox delivery, workflow, or ownership semantics change.
    add_required:
      - verify_replay
    add_recommended:
      - validate_state
      - validate_workflows
      - test_backend_primary
    minimum_evidence: proven

  topology_or_delivery:
    when: Topology, deployable identity, secrets, SOPS, GitOps, delivery path, or production resource binding changes.
    add_required:
      - validate_topology
    add_recommended:
      - validate_platform
      - sops_validate
      - verify_counter_delivery
      - smoke_local_k3d
    minimum_evidence: checked

  release_readiness:
    when: Preparing a release, changing release automation, or claiming release readiness.
    add_required:
      - gate_release
    add_recommended:
      - verify_repo
      - verify_generated
    minimum_evidence: proven

  p0_correctness:
    when: A failure could corrupt data, bypass authorization, leak secrets, break recovery, or invalidate delivery correctness.
    add_required:
      - gate_release
    add_recommended:
      - verify_repo
      - verify_replay
      - verify_counter_delivery
    minimum_evidence: proven

selection_rules:
  - Start from changed paths, then add risk-specific gates.
  - Advisory gates do not block unless a maintainer explicitly promotes them for the change.
  - Guardrail gates may block normal PRs.
  - Invariant gates are reserved for P0 correctness and release readiness.
  - Do not claim a gate passed unless it was executed in this change context.
  - Do not claim semantic correctness from YAML-only changes.
  - Prefer `just check-backend-primary` for ordinary backend-core work.
  - Use `just verify` for broader repo-wide confidence, not as an automatic final gate for every change.
