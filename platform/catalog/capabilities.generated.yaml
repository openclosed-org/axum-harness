    technology: hmac-signed-in-memory-outbox
  adapters:
  - key: outbound_webhooks.noop-adapter
    notes: No-op outbound webhook mode.
    path: packages/notification
  - key: outbound_webhooks.outbox-adapter
    notes: Framework-neutral outbound webhook registry and outbox publisher.
    path: packages/notification
  - key: outbound_webhooks.delivery-worker
    notes: Reference delivery worker entrypoint with retry and dead-letter semantics.
    path: workers/outbound-delivery
  resource_entities:
  - key: outbound-webhook-delivery
    purpose: Registry and delivery ledger for outbound webhook attempts; currently in-memory reference semantics only.
- key: quota_credits
  kind: commercial_capability
  description: |
    Quota and credit ledger capability. Cache can accelerate quota reads, but the ledger itself must remain durable when commercial mode is real.
  states:
    disabled:
      default_provider: quota_credits.disabled
      evidence: tested
      reason: quota enforcement is optional when commercial mode is disabled.
      supported: true
    external_distributed:
      evidence: declared
      reason: distributed quota coordination and reconciliation are not implemented yet.
      supported: false
    external_single_node:
      default_provider: quota_credits.libsql-ledger
      evidence: tested
      semantic_limits:
      - shared external DB can coordinate independent single-node deployables
      - cache is not a ledger source of truth
      supported: true
    local_mock:
      default_provider: quota_credits.in-memory-ledger
      evidence: tested
      semantic_limits:
      - process-local reserve/commit/release semantics
      - development and tests only
      supported: true
    local_real:
      default_provider: quota_credits.libsql-ledger
      evidence: tested
      semantic_limits:
      - durable reservation ledger in local DB
      - no cross-region quota semantics
      supported: true
  providers:
  - key: quota_credits.disabled
    notes: Quota enforcement disabled.
    ownership: repository-local
    technology: none
  - key: quota_credits.in-memory-ledger
    notes: In-memory quota ledger for local_mock.
    ownership: repository-local
    technology: in-memory
  - key: quota_credits.libsql-ledger
    notes: Durable quota reservation and usage ledger.
    ownership: repository-local
