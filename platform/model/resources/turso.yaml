name: turso
type: database
description: >
  SQLite-compatible distributed database (libSQL).
  Primary low-resource path is embedded libSQL/SQLite file storage; Turso
  Cloud is an optional managed backend when teams want to externalize the
  database without operating a local database container. PostgreSQL is not the
  reference backend for this repository.

technology: turso/libsql
version: "0.1.0"

adapters:
  - packages/adapters/storage/turso
  - packages/adapters/storage/sqlite

local_development:
  env_vars:
    TURSO_DATABASE_URL: "file:local.db"
    TURSO_AUTH_TOKEN: "dev-token"

single_vps:
  presets:
    lite: embedded-libsql-file-or-managed-turso-cloud
    standard: embedded-libsql-file-or-managed-turso-cloud
    full: managed-turso-cloud-optional

encryption:
  at_rest: true
  in_transit: true

access_control:
  rbac: true
  abac: false

required_by:
  - counter-service
  - user-service
  - tenant-service
  - auth-service
