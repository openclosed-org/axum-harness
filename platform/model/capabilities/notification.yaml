key: notification
kind: growth_capability
description: >
  Notification capability for outbound user communication. Runtime delivery
  should go through ports and workers rather than direct provider SDK calls from
  business services.

states:
  disabled:
    supported: true
    default_provider: notification.disabled
    reason: notifications are optional for the backend reference chain.
    evidence: declared

  local_mock:
    supported: true
    default_provider: notification.noop
    semantic_limits:
      - no provider side effect; returns skipped outcome for disabled/noop development paths
    evidence: tested

  local_real:
    supported: true
    default_provider: notification.local-outbox
    semantic_limits:
      - framework-neutral in-memory outbox and delivery semantics only
      - durable DB adapter and provider transport are not implemented yet
    evidence: tested

  external_single_node:
    supported: false
    reason: email/push provider adapters are not implemented yet.
    evidence: declared

  external_distributed:
    supported: false
    reason: distributed notification workers, retries, and dead-letter paths are not implemented yet.
    evidence: declared

providers:
  - key: notification.disabled
    technology: none
    ownership: repository-local
    notes: No notification delivery.

  - key: notification.noop
    technology: noop
    ownership: repository-local
    notes: Disabled/noop notification port implementation for tests and local development.

  - key: notification.local-outbox
    technology: in-memory-delivery-outbox
    ownership: repository-local
    notes: Local notification outbox semantics with retry and dead-letter tests.

  - key: notification.smtp
    technology: smtp
    ownership: external-provider-or-resource-container
    notes: Planned transactional email provider lane.

adapters:
  - key: notification.noop-adapter
    path: packages/notification
    notes: No-op notification port implementation.

  - key: notification.outbox-adapter
    path: packages/notification
    notes: Framework-neutral notification outbox port implementation.

  - key: notification.delivery-worker
    path: workers/outbound-delivery
    notes: Reference delivery worker entrypoint with noop transport composition.

resource_entities:
  - key: notification-outbox
    purpose: Notification delivery queue; currently in-memory reference semantics only.
