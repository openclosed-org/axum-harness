key: outbound_webhooks
kind: integration_capability
description: >
  Outbound webhook capability for product integrations. Delivery must eventually
  use a durable registry, signing, retries, and a dead-letter path.

states:
  disabled:
    supported: true
    default_provider: outbound_webhooks.disabled
    reason: outbound product webhooks are optional.
    evidence: declared

  local_mock:
    supported: true
    default_provider: outbound_webhooks.noop
    semantic_limits:
      - no external HTTP delivery; exercises disabled/noop path only
    evidence: tested

  local_real:
    supported: true
    default_provider: outbound_webhooks.local-signed-outbox
    semantic_limits:
      - in-memory registry and outbox only; durable registry is not implemented yet
      - delivery worker uses noop transport in its reference entrypoint
    evidence: tested

  external_single_node:
    supported: false
    reason: external delivery worker is not implemented yet.
    evidence: declared

  external_distributed:
    supported: false
    reason: distributed delivery workers and replay gates are not implemented yet.
    evidence: declared

providers:
  - key: outbound_webhooks.disabled
    technology: none
    ownership: repository-local
    notes: No outbound webhook delivery.

  - key: outbound_webhooks.noop
    technology: noop
    ownership: repository-local
    notes: Disabled/noop outbound webhook path.

  - key: outbound_webhooks.local-signed-outbox
    technology: hmac-signed-in-memory-outbox
    ownership: repository-local
    notes: Local registry, HMAC signing, retry, and dead-letter semantics.

adapters:
  - key: outbound_webhooks.noop-adapter
    path: packages/notification
    notes: No-op outbound webhook mode.

  - key: outbound_webhooks.outbox-adapter
    path: packages/notification
    notes: Framework-neutral outbound webhook registry and outbox publisher.

  - key: outbound_webhooks.delivery-worker
    path: workers/outbound-delivery
    notes: Reference delivery worker entrypoint with retry and dead-letter semantics.

resource_entities:
  - key: outbound-webhook-delivery
    purpose: Registry and delivery ledger for outbound webhook attempts; currently in-memory reference semantics only.
