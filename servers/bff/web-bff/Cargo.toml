[package]
name = "web-bff"
version = "0.1.0"
edition = "2024"
publish = false
description = "Backend For Frontend — Web端聚合层 (Axum)"
license = "Apache-2.0"
rust-version.workspace = true

[dependencies]
# Internal — services (trait-only), contracts, core
counter-service = { workspace = true }
tenant-service = { workspace = true }
user-service = { workspace = true }
event-bus = { workspace = true }
contracts_api = { workspace = true }
contracts_errors = { workspace = true }
contracts_events = { workspace = true }
kernel = { workspace = true }
data = { workspace = true }
storage_turso = { workspace = true }
storage_surrealdb = { workspace = true, optional = true }
observability = { workspace = true }
authn-oidc-verifier = { workspace = true }
authz = { workspace = true }
commercial = { workspace = true }
security-audit = { workspace = true }
security-context = { workspace = true }
security-runtime-policy = { workspace = true }
platform = { workspace = true }

# Axum HTTP framework
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
reqwest = { workspace = true }

# Serialization & validation
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Auth
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
subtle = "2"

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }

# Cache
moka = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
async-trait = "0.1"
futures-util = "0.3"

# API documentation
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { version = "0.2", features = ["axum"] }
workspace-hack = { version = "0.1", path = "../../../packages/workspace-hack" }

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
tracing-test = { workspace = true }
jsonwebtoken = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
mockito = { workspace = true }

[features]
default = []
surrealdb = ["dep:storage_surrealdb", "storage_surrealdb/http"]

[lints]
workspace = true
