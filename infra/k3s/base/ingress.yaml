# Ingress — Traefik routing rules
# Routes:
#   api.example.com/*  → web-bff:3010
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app
  labels:
    app.kubernetes.io/part-of: tauri-sveltekit-axum
  annotations:
    # Traefik-specific annotations
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: app-redirect-https@kubernetescrd
spec:
  rules:
    # ── API routes (Web BFF) ──────────────────────────────────
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-bff
                port:
                  name: http
  # TLS is handled by Traefik + Let's Encrypt (configured in k3s)
