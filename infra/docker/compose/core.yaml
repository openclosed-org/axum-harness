# Podman/Docker Compose — Official Resource Containers
#
# Usage:
#   docker compose -f infra/docker/compose/core.yaml up -d
#   docker compose -f infra/docker/compose/core.yaml down
#
# This file manages optional official resource containers. First-party Rust
# deployables should be built outside the runtime host and run as binaries or
# prebuilt images. Do not use VPS Podman or K3s nodes to compile first-party Rust.
#
# Resource preset intent:
#   - lite: no default containers; use embedded/local/in-process/managed backends
#   - surrealdb: SurrealDB official container only
#   - standard: SurrealDB + NATS + Valkey
#   - full: standard + heavier optional resources such as MinIO and sqld
#
# Stack:
#   - sqld:8080           — optional libSQL server profile, not Turso Cloud
#   - nats:4222           — NATS message broker (JetStream enabled)
#   - nats:8222           — NATS monitoring HTTP
#   - valkey:6379         — Valkey cache (Redis-compatible)
#   - minio:9000          — MinIO object storage API
#   - minio:9001          — MinIO Console UI

services:
  # ── Turso/libSQL Database ──────────────────────────────────
  # Note: Turso is embedded in the application (no separate server).
  # This service is a placeholder for future Turso edge/sync server.
  # For now, databases are created via application code.
  #
  # If you need a standalone libSQL server for testing:
  # Use libsql-server instead of embedded mode. This is optional and only starts
  # with `--profile full`; the default backend path remains embedded libSQL.
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:e4beaca
    ports:
      - "8080:8080"  # HTTP API
      - "5001:5001"  # gRPC
    environment:
      - SQLD_NODE=primary
      - SQLD_DB_PATH=/var/lib/sqld
      - SQLD_HTTP_LISTEN_ADDR=0.0.0.0:8080
      - SQLD_GRPC_LISTEN_ADDR=0.0.0.0:5001
    volumes:
      - turso-data:/var/lib/sqld
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - full

  # ── NATS Message Broker ────────────────────────────────────
  # Used for: Event bus, pub/sub messaging, worker communication
  nats:
    image: nats:2.14.0-alpine
    ports:
      - "4222:4222"  # Client port
      - "8222:8222"  # Monitoring HTTP
      - "6222:6222"  # Cluster port
    command:
      - "-js"  # Enable JetStream (persistent messaging)
      - "-m"
      - "8222"
      - "--store_dir=/data/jetstream"
    volumes:
      - nats-data:/data
    environment:
      - NATS_LOG_LEVEL=warn
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - standard
      - full

  # ── Valkey Cache (Redis-compatible) ────────────────────────
  # Used for: Caching, session storage, rate limiting
  valkey:
    image: valkey/valkey:9.0.3-alpine
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles:
      - standard
      - full

  # ── MinIO Object Storage ───────────────────────────────────
  # Used for: File uploads, backups, blob storage
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console UI
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_BROWSER=on
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # ── MinIO Bucket Initialization ────────────────────────────
  # Creates default buckets after MinIO starts
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 minioadmin minioadmin;
        mc mb -p myminio/uploads 2>/dev/null || true;
        mc mb -p myminio/backups 2>/dev/null || true;
        mc mb -p myminio/temp 2>/dev/null || true;
        echo 'Buckets created successfully';
      "
    profiles:
      - full

  # ── SurrealDB Database Server ──────────────────────────────
  # Postgres-style local/single-VPS operation: independent DB server managed by
  # Podman/Docker Compose, with named-volume persistence and explicit profile.
  surrealdb:
    image: surrealdb/surrealdb:v3.0.5
    user: "0:0"
    command:
      - start
      - --no-banner
      - --log
      - warn
      - --user
      - ${SURREALDB_USER:-root}
      - --pass
      - ${SURREALDB_PASS:-root}
      - --default-namespace
      - ${SURREALDB_NS:-axh}
      - --default-database
      - ${SURREALDB_DB:-main}
      - surrealkv:///data/database
    ports:
      - "8000:8000"
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - surrealdb
      - standard
      - full

volumes:
  turso-data:
    driver: local
  nats-data:
    driver: local
  valkey-data:
    driver: local
  minio-data:
    driver: local
  surrealdb-data:
    driver: local
