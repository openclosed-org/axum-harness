# Podman Compose — Optional Application Image Proof Stack
#
# Usage:
#   podman compose -f infra/docker/compose/app.yaml up -d
#   podman compose -f infra/docker/compose/app.yaml down
#
# This file is not the recommended single-VPS deployment path. Runtime hosts
# should not compile first-party Rust code. Prefer binary-first systemd
# deployment, or use prebuilt images produced by a developer machine or CI.
#
# Stack:
#   - gateway:3000        — Pingora reverse proxy (API entry point)
#   - web-bff:3010        — Web BFF server (distroless)
#   - surrealdb:8000      — SurrealDB (dev sidecar, kv-mem)
#
# NOT included (replaced by application-layer alternatives):
#   - PostgreSQL → Turso (libSQL) / SurrealDB
#   - Redis → Moka (in-process cache)
#   - NATS server → in-process event bus (tokio broadcast, Phase 1)
#   - nginx → Pingora

services:
  # ── Pingora Gateway (Reverse Proxy) ────────────────────────
  # Routes all HTTP traffic to web-bff:3010.
  gateway:
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile.gateway
    ports:
      - "3000:3000"
    environment:
      - API_UPSTREAM=web-bff:3010
      - BIND=0.0.0.0:3000
    depends_on:
      web-bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Web BFF Service (Axum) ──────────────────────────────────
  web-bff:
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile.web-bff
    expose:
      - "3010"
    environment:
      - APP_DATABASE_URL=file:/tmp/web-bff.db
      - APP_SERVER_HOST=0.0.0.0
      - APP_SERVER_PORT=3010
      - RUST_LOG=info,web-bff=debug
    volumes:
      - web-bff-data:/data
  # ── SurrealDB (dev sidecar) ────────────────────────────────
  # Phase 1: in-memory (kv-mem) for local dev
  # Phase 2: switch to persistent storage (tikv/rocksdb backend)
  surrealdb:
    image: surrealdb/surrealdb:v3.0.5
    expose:
      - "8000"
    command: >
      start
      --log warn
      --user root
      --pass root
      --bind 0.0.0.0:8000
      memory
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  web-bff-data:
