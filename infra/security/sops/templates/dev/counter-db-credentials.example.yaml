# Counter DB Credentials — Dev Secrets Example
#
# Copy this file to counter-db-credentials.yaml in the same directory, replace
# placeholders locally, then run `just sops-encrypt-dev counter-db-credentials`.
# This secret is for explicit `external_single_node` or `external_distributed`
# database capability states and cluster-style tests. It is not merged into
# `just sops-run ... local_real`.
apiVersion: v1
kind: Secret
metadata:
    name: counter-db-credentials
    namespace: app
    labels:
        app.kubernetes.io/name: counter-db-credentials
        app.kubernetes.io/env: dev
        harness.openclosed.org/entity-type: secret
        harness.openclosed.org/capability: database
        harness.openclosed.org/capability-state: external_single_node
        harness.openclosed.org/provider: database.turso-cloud
        harness.openclosed.org/resource: counter-db
type: Opaque
stringData:
    APP_TURSO_URL: "libsql://REPLACE_WITH_TURSO_DATABASE_HOST"
    APP_TURSO_AUTH_TOKEN: "REPLACE_WITH_TURSO_TOKEN"
    OUTBOX_DATABASE_URL: "libsql://REPLACE_WITH_TURSO_DATABASE_HOST"
    OUTBOX_TURSO_AUTH_TOKEN: "REPLACE_WITH_TURSO_TOKEN"
    PROJECTOR_DATABASE_URL: "libsql://REPLACE_WITH_TURSO_DATABASE_HOST"
    PROJECTOR_TURSO_AUTH_TOKEN: "REPLACE_WITH_TURSO_TOKEN"
